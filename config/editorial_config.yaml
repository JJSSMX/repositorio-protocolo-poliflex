# ==============================================================================
# CONFIGURACIÓN EDITORIAL CENTRALIZADA — PROTOCOLO FAMILIAR POLIFLEX
# ==============================================================================
# Parámetros globales para el motor editorial (Typst / HTML-CSS / Pandoc).
# Modifique estos valores para alterar la maquetación sin tocar el contenido.
# ==============================================================================

metadata:
  title: "Protocolo Familiar"
  subtitle: "Marco Institucional de Gobernanza y Continuidad Familiar–Empresarial"
  company: "Poliductos Flexibles, S.A. de C.V."
  brand: "POLIFLEX"
  family: "Familia Velasco Chedraui"
  location: "Coatepec, Veracruz, México"
  date: "Agosto de 2026"
  version: "2.0"
  canonical_source: "/capitulos/*.md"

page:
  format_name: "media_carta"        # Media Carta / Statement / Half Letter
  width: "5.5in"                   # 139.7 mm
  height: "8.5in"                  # 215.9 mm
  facing_pages: true               # Páginas enfrentadas (doble faz: recto / verso)
  bleed: "3mm"                     # Sangrado para corte de imprenta
  margins:
    top: "18mm"
    bottom: "18mm"
    inside: "18mm"                 # Margen interior / lomo para encuadernación (gutter)
    outside: "15mm"                # Margen exterior / corte

typography:
  fonts:
    body: "Inter"                  # Alternativas: "Libertinus Serif", "Georgia", "Segoe UI"
    headings: "Inter"              # Tipografía de títulos
    tables: "Inter"                # Tipografía para cuadros y tablas
    monospace: "Consolas"
  sizes:
    body: "9.5pt"
    h1: "15.5pt"                   # Título de capítulo
    h2: "12pt"                     # Subsección principal
    h3: "10.5pt"                   # Cláusula o artículo
    h4: "9.5pt"                    # Subcláusula
    footnote: "8pt"
    folio: "8pt"                   # Número de página
    header_text: "7.5pt"
  leading: "0.65em"                # Espaciado adicional entre líneas consecutivas en Typst (ver nota técnica)
  line_height: 1.35                # Multiplicador equivalente para HTML/CSS
  tracking: "0pt"                  # Espaciado entre caracteres (letter-spacing)

colors:
  primary: "#0f172a"               # Slate 900 (títulos principales, acentos fuertes)
  secondary: "#1e293b"             # Slate 800 (subtítulos H2, H3)
  accent: "#0284c7"                # Azul institucional sobrio (filetes H1, acentos)
  accent_light: "#38bdf8"          # Azul claro (detalles de portada)
  text_main: "#0f172a"             # Texto principal de cuerpo
  text_muted: "#64748b"            # Gris slate para folios y encabezados
  border: "#cbd5e1"                # Bordes de tablas y separadores
  bg_subtle: "#f8fafc"             # Fondo alterno para filas de tablas
  bg_header: "#f1f5f9"             # Fondo de cabeceras de tabla
  cover_bg: "#0f172a"              # Fondo oscuro institucional de portada

lines:
  h1_rule_width: "1.5pt"           # Grosor del filete bajo el título H1
  table_border_width: "0.5pt"      # Grosor de la cuadrícula de tabla
  table_header_rule_width: "1.2pt" # Grosor del filete bajo cabecera de tabla
  footer_rule_width: "0.5pt"       # Grosor de filete opcional en pie de página
  signature_line_width: "0.75pt"   # Grosor de línea para firmas

paragraphs:
  justify: true                    # Texto justificado
  hyphenation: true                # Separación silábica en español
  language: "es"                   # Código de idioma
  indent_first_line: "0pt"         # Sangría de primera línea
  space_below: "7pt"               # Separación entre párrafos ordinarios
  widows: 2                        # Control de viudas (mínimo de líneas al pie)
  orphans: 2                       # Control de huérfanas (mínimo de líneas al inicio)

headings:
  h1:
    page_break_before: true        # Salto de página antes de cada capítulo
    start_on: "recto"              # "recto" (impar/derecha) o "any" (siguiente página)
    keep_with_next: true           # Evitar título huérfano (sticky block)
    space_above: "0pt"
    space_below: "14pt"
    line_rule_below: true          # Filete divisorio bajo el título
  h2:
    keep_with_next: true
    space_above: "16pt"
    space_below: "6pt"
  h3:
    keep_with_next: true
    space_above: "12pt"
    space_below: "5pt"
  h4:
    keep_with_next: true
    space_above: "9pt"
    space_below: "4pt"

numbering_styles:
  heading_levels: "1.1.1.1"        # Numeración jerárquica decimal de cláusulas
  legal_incisos: "a)"              # Incisos alfabéticos de primer nivel
  legal_sub_incisos: "i."          # Sub-incisos romanos minúsculos
  procedural_fractions: "I."       # Fracciones en romanos mayúsculos
  numbered_steps: "1."             # Pasos procedimentales decimales

legal_lists:
  space_between_items: "4pt"
  alpha_prefix_width: "18pt"
  roman_upper_prefix_width: "22pt"
  roman_lower_indent: "15pt"
  roman_lower_prefix_width: "18pt"
  decimal_prefix_width: "18pt"

headers_footers:
  omit_on_cover: true
  omit_on_chapter_start: true
  header:
    verso: "Poliductos Flexibles, S.A. de C.V. · Protocolo Familiar"
    recto: "chapter_title"         # Dinámico según el capítulo actual
  footer:
    folio_position: "outer"        # Exterior: izquierda en verso, derecha en recto
    show_border: false             # Filete sutil sobre el folio

